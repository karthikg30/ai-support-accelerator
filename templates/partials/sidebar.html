<nav class="sidebar">
    
    <div class="sidebar-brand">
        <i class="bi bi-headset brand-icon"></i>
        <div>
            <div class="brand-title">Support Accelerator AI</div>
            <div class="brand-subtitle">AI-Guided Support Assistant</div>
        </div>
    </div>

    <ul class="sidebar-menu">
        <li>
            <a href="{% url 'assistant' %}"
               class="sidebar-link {% if request.resolver_match.url_name == 'assistant' %}active{% endif %}">
                <i class="bi bi-robot"></i> <span>AI Assistant</span>
            </a>
        </li>
        <li>
            <a href="{% url 'kb_home' %}"
               class="sidebar-link {% if request.resolver_match.url_name in 'kb_home kb_category kb_article' %}active{% endif %}">
                <i class="bi bi-journal-text"></i> <span>Knowledge Base</span>
            </a>
        </li>
        <li>
            <a href="{% url 'create_case' %}"
               class="sidebar-link {% if request.resolver_match.url_name == 'create_case' %}active{% endif %}">
                <i class="bi bi-plus-circle"></i> <span>Create Case</span>
            </a>
        </li>
        <li>
            <a href="{% url 'my_cases' %}"
               class="sidebar-link {% if request.resolver_match.url_name in 'my_cases case_detail edit_draft' %}active{% endif %}">
                <i class="bi bi-folder2-open"></i> <span>My Cases</span>
            </a>
        </li>
        
    </ul>

    <div class="sidebar-footer">
        <div class="sidebar-user">
            <div class="sidebar-avatar">
                {{ user.first_name.0|default:user.username.0|upper }}
            </div>
            <div class="sidebar-user-name">
                {{ user.get_full_name|default:user.username }}
            </div>
        </div>

        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="sidebar-link logout-btn">
                <i class="bi bi-box-arrow-right"></i> <span>Logout</span>
            </button>
        </form>
    </div>
</nav>
