<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#FFFF"/>

  <!-- antenna -->
  <rect x="30.5" y="8" width="3" height="7" rx="1.5" fill="#F47F28"/>
  <circle cx="32" cy="7" r="3.5" fill="#F47F28"/>

  <!-- the O: thick ring forming the robot head -->
  <circle cx="32" cy="36" r="18" fill="none" stroke="#F47F28" stroke-width="7"/>

  <!-- eyes -->
  <circle cx="25.5" cy="32" r="3.5" fill="#F47F28"/>
  <circle cx="38.5" cy="32" r="3.5" fill="#F47F28"/>

  <!-- smile -->
  <path d="M24 40.5 A 9 9 0 0 0 40 40.5"
        fill="none" stroke="#F47F28" stroke-width="3.5" stroke-linecap="round"/>
</svg>